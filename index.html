<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;
const LAST_UPDATED = 'July 30, 2026';

function Gauge({ score, label }) {
  const r = 60, c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(100, score));
  const offset = c - (pct / 100) * c;
  const color = pct >= 75 ? '#3DDC84' : pct >= 50 ? '#F5A623' : '#FF5470';
  return (
    <div className="gauge">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="70" cy="70" r={r} fill="none" stroke="#232E3A" strokeWidth="10" />
        <circle cx="70" cy="70" r={r} fill="none" stroke={color} strokeWidth="10"
          strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
          style={{ transition: 'stroke-dashoffset 0.8s ease' }} />
      </svg>
      <div className="num">
        {pct}<small>{label || 'KEYWORD MATCH'}</small>
      </div>
    </div>
  );
}

function KwGroup({ label, items, cls, emptyText }) {
  return (
    <div style={{ marginBottom: 14 }}>
      {label && <span className="ai-step-label">{label}</span>}
      <div className="kw-list">
        {items.map((k, i) => <span key={i} className={"kw " + cls}>{k}</span>)}
        {items.length === 0 && <span style={{ color: 'var(--ink-dim)', fontSize: '13px' }}>{emptyText}</span>}
      </div>
    </div>
  );
}

function localChecks(resume) {
  const checks = [];
  const wc = resume.trim().split(/\s+/).filter(Boolean).length;
  checks.push({
    label: 'Length',
    detail: wc + ' words',
    status: wc < 250 ? 'warn' : wc > 1100 ? 'warn' : 'pass',
    note: wc < 250 ? 'May be too thin for the role — consider adding detail.' : wc > 1100 ? 'Trim toward 1-2 pages for most ATS readers.' : 'Reasonable length for one to two pages.'
  });
  const hasEmail = /[\w.+-]+@[\w-]+\.[a-zA-Z]{2,}/.test(resume);
  checks.push({ label: 'Email address', detail: hasEmail ? 'found' : 'not found', status: hasEmail ? 'pass' : 'fail', note: hasEmail ? 'Parsers can pull your contact info.' : 'Add a plain-text email near the top.' });
  const hasPhone = /(\+?\d[\d\s().-]{7,}\d)/.test(resume);
  checks.push({ label: 'Phone number', detail: hasPhone ? 'found' : 'not found', status: hasPhone ? 'pass' : 'warn', note: hasPhone ? 'Phone number is machine-readable.' : 'Consider adding a phone number.' });
  const sectionWords = ['experience', 'education', 'skills', 'summary', 'work history', 'employment'];
  const lower = resume.toLowerCase();
  const foundSections = sectionWords.filter(w => lower.includes(w));
  checks.push({
    label: 'Standard section headers',
    detail: foundSections.length + ' of ' + sectionWords.length + ' common headers detected',
    status: foundSections.length >= 3 ? 'pass' : 'warn',
    note: foundSections.length >= 3 ? 'ATS parsers recognize these section names.' : 'Use standard headers like "Experience", "Education", "Skills" so parsers can map your content.'
  });
  const bulletCount = (resume.match(/^[\s]*[•\-\*]/gm) || []).length;
  checks.push({
    label: 'Bullet points',
    detail: bulletCount + ' detected',
    status: bulletCount >= 4 ? 'pass' : 'warn',
    note: bulletCount >= 4 ? 'Bulleted achievements parse cleanly.' : 'Bullet points (using -, *, or •) parse more reliably than dense paragraphs.'
  });
  const hasTabsOrOddSpacing = /\t/.test(resume) || /\s{4,}\S/.test(resume);
  checks.push({
    label: 'Layout artifacts',
    detail: hasTabsOrOddSpacing ? 'irregular spacing detected' : 'clean',
    status: hasTabsOrOddSpacing ? 'warn' : 'pass',
    note: hasTabsOrOddSpacing ? 'Tabs or wide gaps often come from tables/columns, which many ATS parsers scramble. Prefer a single-column layout.' : 'No signs of multi-column or table layout in the pasted text.'
  });
  const specialChars = (resume.match(/[^\x00-\x7F]/g) || []).filter(c => !/[•]/.test(c));
  checks.push({
    label: 'Special characters',
    detail: specialChars.length + ' non-standard characters',
    status: specialChars.length > 15 ? 'warn' : 'pass',
    note: specialChars.length > 15 ? 'Icons, symbols, or smart-quotes can render as garbage in some parsers.' : 'Mostly standard characters — safe for parsing.'
  });
  return checks;
}

function statusRank(s) { return s === 'fail' ? 0 : s === 'warn' ? 1 : 2; }

// --- Local (non-AI) keyword overlap: a plain lexical heuristic, same idea a
// keyword-based ATS uses — count meaningful terms in the posting, see which
// literally appear in the resume. No network calls, no AI involved. ---

const STOPWORDS = new Set([
  'a','about','above','after','again','against','all','am','an','and','any','are','as','at','be','because',
  'been','before','being','below','between','both','but','by','can','could','did','do','does','doing','down',
  'during','each','few','for','from','further','had','has','have','having','he','her','here','hers','herself',
  'him','himself','his','how','i','if','in','into','is','it','its','itself','just','me','more','most','my',
  'myself','no','nor','not','now','of','off','on','once','only','or','other','our','ours','ourselves','out',
  'over','own','same','she','should','so','some','such','than','that','the','their','theirs','them',
  'themselves','then','there','these','they','this','those','through','to','too','under','until','up','very',
  'was','we','were','what','when','where','which','while','who','whom','why','will','with','would','you',
  'your','yours','yourself','yourselves',
  'also','etc','per','using','use','used','across','within','including','include','includes','looking',
  'seeking','required','preferred','strong','excellent','ability','abilities','years','year','experience',
  'experienced','work','working','works','job','jobs','role','roles','team','teams','company','companies',
  'candidate','candidates','position','positions','responsibilities','requirements','qualifications','skills',
  'skill','knowledge','understanding','plus','must','ideal','join','new','help','provide','related','apply',
  'benefits','equal','opportunity','employer','nice','familiarity','familiar',
  'someone','need','needs','needed','senior','junior','background','focused','bonus'
]);
const SHORT_ALLOW = new Set(['ai', 'ml', 'ux', 'ui', 'qa', 'pm', 'bi', 'it']);

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function extractKeywords(jd, max = 20) {
  const raw = jd.match(/[a-zA-Z][a-zA-Z0-9+.#-]*/g) || [];
  const freq = new Map();
  for (const w of raw) {
    const token = w.toLowerCase().replace(/^[.#-]+|[.#-]+$/g, '');
    if (!token) continue;
    if (token.length < 3 && !SHORT_ALLOW.has(token)) continue;
    if (STOPWORDS.has(token)) continue;
    if (/^\d+$/.test(token)) continue;
    freq.set(token, (freq.get(token) || 0) + 1);
  }
  return [...freq.entries()]
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .slice(0, max)
    .map(([term]) => term);
}

function tokenAppears(token, text) {
  if (/^[a-z0-9]+$/i.test(token)) {
    return new RegExp('\\b' + escapeRegex(token) + '\\b', 'i').test(text);
  }
  return text.toLowerCase().includes(token.toLowerCase());
}

// Greenhouse's own recruiter keyword-search tool lets recruiters mark search
// terms as "Required" (every term must match) or "Preferred" (any one term
// matches) — see support.greenhouse.io "Search resumes for keywords". We
// mirror that distinction here: if the posting has a "nice to have"-style
// section, terms above it count double toward the score.
const PREFERRED_HEADING_RE = /^(nice[- ]to[- ]haves?|preferred(?: qualifications| skills| experience)?|bonus(?: points?| skills)?|good to have|desired(?: skills| qualifications)?|pluses?|extra credit)\s*:?\s*$/i;
const REQUIRED_WEIGHT = 2;
const PREFERRED_WEIGHT = 1;

function splitRequiredPreferred(jd) {
  const lines = jd.split('\n');
  let charCount = 0;
  for (const raw of lines) {
    const trimmed = raw.trim().replace(/^[-•*]\s*/, '');
    if (trimmed && trimmed.length <= 40 && PREFERRED_HEADING_RE.test(trimmed)) {
      return { required: jd.slice(0, charCount), preferred: jd.slice(charCount) };
    }
    charCount += raw.length + 1;
  }
  return { required: jd, preferred: '' };
}

function keywordOverlap(jd, resume) {
  const { required, preferred } = splitRequiredPreferred(jd);
  const hasSplit = preferred.trim().length > 0;
  const requiredKeywords = extractKeywords(required, hasSplit ? 15 : 20);
  const preferredKeywordsRaw = hasSplit ? extractKeywords(preferred, 8) : [];
  const preferredKeywords = preferredKeywordsRaw.filter(k => !requiredKeywords.includes(k));
  if (requiredKeywords.length === 0 && preferredKeywords.length === 0) return null;

  const requiredMatched = requiredKeywords.filter(k => tokenAppears(k, resume));
  const requiredMissing = requiredKeywords.filter(k => !requiredMatched.includes(k));
  const preferredMatched = preferredKeywords.filter(k => tokenAppears(k, resume));
  const preferredMissing = preferredKeywords.filter(k => !preferredMatched.includes(k));

  const totalWeight = requiredKeywords.length * REQUIRED_WEIGHT + preferredKeywords.length * PREFERRED_WEIGHT;
  const earnedWeight = requiredMatched.length * REQUIRED_WEIGHT + preferredMatched.length * PREFERRED_WEIGHT;
  const score = totalWeight > 0 ? Math.round((earnedWeight / totalWeight) * 100) : 0;

  return {
    score,
    matched: [...requiredMatched, ...preferredMatched],
    missing: [...requiredMissing, ...preferredMissing],
    requiredMatched, requiredMissing, preferredMatched, preferredMissing,
    hasPreferredSection: preferredKeywords.length > 0,
  };
}

// --- Knockout-style requirement detector -------------------------------
// Workable's ATS supports yes/no "knockout questions" on the application
// form that auto-reject a candidate before a human ever opens the resume —
// entirely separate from any keyword score (see support.workable.com
// "Auto-disqualify candidates using application form questions"). We can't
// see the employer's actual application form, but we can flag posting
// language that commonly turns into that kind of hard requirement, purely
// as a heads-up — still 100% local text matching, no AI, no network call.
const KNOCKOUT_PATTERNS = [
  { label: 'Work authorization', re: /\b(must (?:already )?be authorized to work|work authorization|no (?:visa )?sponsorship|not (?:able|available) to sponsor|legally (?:authorized|eligible) to work)\b/i },
  { label: 'On-site / location', re: /\b(on-?site (?:\d+ days|full[- ]time|required|only)|relocat(?:e|ion) (?:is )?required|must (?:live|reside|be located|be based) (?:in|near|within))\b/i },
  { label: 'Security clearance', re: /\b(security clearance|active clearance|able to obtain (?:a )?clearance|u\.?s\.?\s*citizen(?:ship)?\s*(?:is )?required)\b/i },
  { label: 'License or certification', re: /\b(valid driver'?s?\s*licen[sc]e|must (?:hold|have|possess) a (?:current |valid |active )?(?:license|licence|certification)|licensure required)\b/i },
  { label: 'Minimum years of experience', re: /\b\d+\+?\s*(?:years?|yrs)\s*(?:of\s*)?(?:relevant\s*|professional\s*|direct\s*)?experience\s*(?:is\s*)?required\b/i },
  { label: 'Degree requirement', re: /\b(bachelor'?s?\s*degree\s*(?:is\s*)?required|master'?s?\s*degree\s*(?:is\s*)?required|degree\s*(?:is\s*)?required|must have a (?:bachelor|master|ph\.?d))\b/i },
  { label: 'Background check', re: /\b(background check\s*(?:is\s*)?required|must pass a background check|subject to a background check)\b/i },
  { label: 'Physical requirement', re: /\b(able to lift (?:up to )?\d+|must be able to (?:stand|lift|carry))\b/i },
  { label: 'Schedule / availability', re: /\b(must be (?:available|willing) to work (?:nights|weekends|holidays|on-?call|shifts)|shift work required|24\/7 availability)\b/i },
];

function detectKnockoutRequirements(jd) {
  const sentences = jd.split(/\r?\n|(?<=[.!?])\s+/).map(s => s.trim()).filter(Boolean);
  const found = [];
  const seenLabels = new Set();
  for (const s of sentences) {
    for (const { label, re } of KNOCKOUT_PATTERNS) {
      if (seenLabels.has(label)) continue;
      if (re.test(s)) {
        found.push({ label, snippet: s.length > 160 ? s.slice(0, 160) + '…' : s });
        seenLabels.add(label);
      }
    }
  }
  return found;
}

// --- ATS parsing simulation (Workday / Greenhouse) ----------------------
// Real ATS parsers (Sovren-based for Greenhouse, a proprietary parser for
// Workday) extract structured fields from a resume — name, contact info,
// work history entries, skills — for a recruiter's structured view rather
// than reading raw text. We can't call either vendor's real parser from a
// static page, so this simulates the same field-extraction pass with the
// documented failure modes each platform is known for, and shows the user
// what a recruiter's structured view would likely look like, not just a
// pass/fail checklist. Entirely local heuristics — no network call.

const PLATFORM_INFO = {
  greenhouse: {
    name: 'Greenhouse',
    blurb: 'Greenhouse uses a resume-parsing service (Sovren) to extract structured fields for recruiters. It tolerates single-column layouts well but commonly mis-splits multi-column resumes, text boxes, and headers/footers into the wrong field or drops them entirely.',
  },
  workday: {
    name: 'Workday',
    blurb: "Workday's parser is notoriously strict — it's the platform most often blamed for silently dropping or garbling resume content. It struggles most with tables, nested/multi-level bullets, text inside headers or footers, and non-standard date formats.",
  },
};

function simulateAtsParse(resume, platform) {
  const lines = resume.split('\n').map(l => l.trim()).filter(Boolean);
  const emailMatch = resume.match(/[\w.+-]+@[\w-]+\.[a-zA-Z]{2,}/);
  const phoneMatch = resume.match(/(\+?\d[\d\s().-]{7,}\d)/);
  const nameGuess = lines[0] && lines[0].length < 60 && !/@|\d{3}/.test(lines[0]) ? lines[0] : null;
  const hasTabsOrCols = /\t/.test(resume) || /\s{4,}\S/.test(resume);
  const sectionRe = /(experience|work history|employment|education|skills|summary)/i;
  const sectionLines = lines.filter(l => l.length < 40 && sectionRe.test(l));
  const bulletCount = (resume.match(/^[\s]*[•\-\*]/gm) || []).length;
  const dateRe = /\b(19|20)\d{2}\b/g;
  const dates = resume.match(dateRe) || [];
  const nonStdDate = /\b\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}\b/.test(resume);
  const hasHyperlink = /(linkedin\.com|http:\/\/|https:\/\/)/i.test(resume);
  const nestedBullets = /^\s{2,}[•\-\*]/m.test(resume);

  const fields = [];
  fields.push({ key: 'Full name', val: nameGuess || 'Not confidently isolated', cls: nameGuess ? 'pass' : 'shaky' });
  fields.push({ key: 'Email', val: emailMatch ? emailMatch[0] : 'Not found', cls: emailMatch ? 'pass' : 'broken' });
  fields.push({ key: 'Phone', val: phoneMatch ? phoneMatch[0] : 'Not found', cls: phoneMatch ? 'pass' : 'shaky' });
  fields.push({ key: 'Section headers detected', val: sectionLines.length > 0 ? sectionLines.slice(0, 6).join(' · ') : 'None matched standard headers', cls: sectionLines.length >= 2 ? 'pass' : 'shaky' });
  fields.push({ key: 'Work history entries (est.)', val: dates.length >= 2 ? Math.max(1, Math.floor(dates.length / 2)) + ' date-anchored entries found' : 'Too few dates to isolate entries', cls: dates.length >= 2 ? 'pass' : 'shaky' });
  fields.push({ key: 'Bulleted achievements', val: bulletCount + ' bullet lines', cls: bulletCount >= 4 ? 'pass' : 'shaky' });

  // Platform-specific risk flags, weighted toward each platform's documented weak spots.
  const risks = [];
  if (hasTabsOrCols) {
    risks.push(platform === 'workday'
      ? { label: 'Column/table layout', detail: 'Tabs or wide gaps detected — Workday frequently reads multi-column resumes top-to-bottom across columns, interleaving unrelated lines into one garbled field.', status: 'fail' }
      : { label: 'Column/table layout', detail: 'Tabs or wide gaps detected — Greenhouse\'s parser (Sovren) usually keeps columns separate but can merge a narrow sidebar (dates, skills) into the wrong section.', status: 'warn' });
  }
  if (nestedBullets) {
    risks.push(platform === 'workday'
      ? { label: 'Nested bullet levels', detail: 'Multi-level bullets detected — Workday commonly flattens nested bullets into one run-on line, losing the sub-point structure.', status: 'warn' }
      : { label: 'Nested bullet levels', detail: 'Multi-level bullets detected — generally preserved, but sub-bullets sometimes lose indentation once rendered in the recruiter view.', status: 'pass' });
  }
  if (hasHyperlink) {
    risks.push(platform === 'workday'
      ? { label: 'Embedded hyperlinks', detail: 'Link-style text found — Workday sometimes renders the underlying URL instead of the display text, or strips it, depending on the source document format.', status: 'warn' }
      : { label: 'Embedded hyperlinks', detail: 'Link-style text found — Greenhouse generally preserves link text cleanly in its parsed view.', status: 'pass' });
  }
  if (nonStdDate) {
    risks.push({ label: 'Non-standard date format', detail: 'Numeric dates like 03/2021 detected — both platforms parse "Month YYYY" (e.g. "March 2021") far more reliably for sorting work history chronologically.', status: 'warn' });
  }
  if (sectionLines.length < 2) {
    risks.push({ label: 'Unrecognized section headers', detail: 'Few or no standard section headers found — both platforms rely on header text to bucket content, so custom headers like "My Journey" instead of "Experience" often get dumped into the wrong field or ignored.', status: 'fail' });
  }
  if (risks.length === 0) {
    risks.push({ label: 'No major platform-specific risks detected', detail: 'This resume\'s structure looks straightforward enough that both parsers should extract it without obvious field-splitting issues.', status: 'pass' });
  }

  return { fields, risks };
}

// --- Bring-your-own-AI bridge -----------------------------------------
// We never call any AI service ourselves. Instead we build a plain-text
// prompt the user copies into whatever AI they already have (ChatGPT,
// Claude, Gemini, a local model, anything with a chat box), and parse
// whatever JSON that AI hands back. No API key, no CORS, no provider
// lock-in, and nothing leaves this page unless the user pastes it
// somewhere else themselves.

function buildAiPrompt(jd, resume) {
  return `You are an ATS resume analyst. Compare the RESUME to the JOB POSTING.
Return ONLY raw JSON (no markdown fences, no preamble, no commentary before or after) matching exactly this shape:
{"score": <0-100 integer, how well resume matches posting for ATS + relevance>,
"matched_keywords": [<up to 10 important terms from the posting that appear in the resume>],
"missing_keywords": [<up to 10 important terms/skills from the posting NOT found in the resume>],
"summary_rewrite": "<a tightened 2-3 sentence professional summary tailored to this posting, based on the resume's real background>",
"bullet_rewrites": [{"before": "<a real bullet-ish line from the resume, verbatim or close>", "after": "<rewritten version that adds a missing keyword naturally and is more quantified>", "why": "<one short sentence>"} - up to 4 items]}
Keep every string concise. Do not invent employers, titles, or metrics not implied by the resume.

JOB POSTING:
${jd.slice(0, 6000)}

RESUME:
${resume.slice(0, 6000)}`;
}

function buildCoverLetterPrompt(jd, resume) {
  return `You are a job-application writing assistant. Using the RESUME and JOB POSTING below, write a tailored cover letter and a LinkedIn headline.
Return ONLY raw JSON (no markdown fences, no preamble, no commentary before or after) matching exactly this shape:
{"cover_letter": "<a 3-4 paragraph cover letter, professional tone, tailored to this specific posting, grounded only in real experience from the resume — do not invent employers, titles, or metrics>",
"linkedin_headline": "<one LinkedIn headline, under 220 characters, that positions this candidate for roles like this one>",
"headline_alt": "<a second, differently-angled LinkedIn headline option, also under 220 characters>"}
Keep the cover letter concise — no more than about 300 words.

JOB POSTING:
${jd.slice(0, 6000)}

RESUME:
${resume.slice(0, 6000)}`;
}

function parseAiResponse(raw) {
  let text = (raw || '').trim();
  if (!text) throw new Error('empty');
  text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
  try {
    return JSON.parse(text);
  } catch (e) {
    const match = text.match(/\{[\s\S]*\}/);
    if (match) {
      try { return JSON.parse(match[0]); } catch (e2) { /* fall through */ }
    }
    throw new Error('unparsable');
  }
}

// --- Scan history --------------------------------------------------------
// Stored in localStorage only — never sent anywhere. We deliberately save
// just a title snippet + score + applied status, not the full resume or
// job posting text, to keep what's persisted on disk minimal.

const HISTORY_KEY = 'ats-scan-history-v1';

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}

function saveHistory(list) {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
  } catch (e) { /* storage unavailable (private mode, quota, etc.) — skip silently */ }
}

function jdTitleFrom(jd) {
  const line = (jd.split('\n').find(l => l.trim().length > 3) || '').trim();
  if (!line) return 'Untitled posting';
  return line.length > 90 ? line.slice(0, 90) + '…' : line;
}

// --- Cookie consent -------------------------------------------------------
// Google Consent Mode v2: gtag.js loads with analytics_storage defaulted to
// 'denied' (see <head>). Nothing is actually tracked until the visitor hits
// Accept below, which flips that to 'granted'. The choice is remembered in
// localStorage so the banner only shows once, and "Cookie Settings" lets
// them reopen it and change their mind at any time.

const CONSENT_KEY = 'resumechkr-cookie-consent';

function loadConsent() {
  try { return localStorage.getItem(CONSENT_KEY); } catch (e) { return null; }
}

function applyConsent(choice) {
  try { localStorage.setItem(CONSENT_KEY, choice); } catch (e) { /* storage unavailable — skip silently */ }
  if (window.gtag) {
    window.gtag('consent', 'update', { analytics_storage: choice === 'accepted' ? 'granted' : 'denied' });
  }
}

// --- Resume file upload ---------------------------------------------------
// Extraction happens entirely client-side (pdf.js / mammoth.js loaded from
// a CDN on demand, only when a file is actually uploaded). The file itself
// is never sent anywhere — same as pasted text.

const scriptLoadCache = {};

function loadScriptOnce(src) {
  if (scriptLoadCache[src]) return scriptLoadCache[src];
  scriptLoadCache[src] = new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src;
    el.onload = () => resolve();
    el.onerror = () => reject(new Error('script load failed: ' + src));
    document.head.appendChild(el);
  });
  return scriptLoadCache[src];
}

async function extractPdfText(file) {
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  const pdfjsLib = window.pdfjsLib;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const doc = await pdfjsLib.getDocument({ data: buf }).promise;
  const pageTexts = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    const content = await page.getTextContent();
    let lastY = null;
    let line = [];
    const lines = [];
    content.items.forEach(item => {
      const y = item.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 2) {
        lines.push(line.join(' '));
        line = [];
      }
      line.push(item.str);
      lastY = y;
    });
    if (line.length) lines.push(line.join(' '));
    pageTexts.push(lines.join('\n'));
  }
  return pageTexts.join('\n\n').replace(/[ \t]{2,}/g, ' ').trim();
}

async function extractDocxText(file) {
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js');
  const buf = await file.arrayBuffer();
  const result = await window.mammoth.extractRawText({ arrayBuffer: buf });
  return result.value.trim();
}

async function extractResumeFileText(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.pdf')) return extractPdfText(file);
  if (name.endsWith('.docx')) return extractDocxText(file);
  if (name.endsWith('.txt') || name.endsWith('.md')) return (await file.text()).trim();
  if (name.endsWith('.doc')) throw new Error('legacy-doc');
  throw new Error('unsupported');
}

            <p className="ai-note">
              Paste your resume in the box above, then add up to 20 postings below to rank by keyword-overlap fit — useful when you've got a shortlist of target companies and want to prioritize which posting to tailor for first. Same local, no-AI scoring as the single scan above; nothing leaves your browser. This list is session-only right now and clears on reload.
            </p>
            {batchJobs.map((b, i) => (
              <div key={b.id} className="batch-job">
                <div className="batch-job-head">
                  <input
                    type="text"
                    placeholder={"Posting " + (i + 1) + " label (e.g. company / role) — optional"}
                    value={b.title}
                    onChange={e => updateBatchJob(b.id, 'title', e.target.value)}
                  />
                  {batchJobs.length > 1 && (
                    <button className="batch-remove" onClick={() => removeBatchJob(b.id)} title="Remove posting" aria-label="Remove posting">×</button>
                  )}
                </div>
                <textarea
                  placeholder="Paste this job posting's text here…"
                  value={b.text}
                  onChange={e => updateBatchJob(b.id, 'text', e.target.value)}
                />
              </div>
            ))}
            <div className="batch-actions">
              {batchJobs.length < 20 && <button className="copy-btn" onClick={addBatchJob}>+ Add another posting</button>}
              <button className="scan" disabled={!resume.trim() || batchJobs.filter(b => b.text.trim().length > 20).length === 0} onClick={runBatchRank}>
                Rank all
              </button>
            </div>

            {batchResults && (
              <table className="rank-table" style={{ marginTop: 16 }}>
                <thead>
                  <tr><th>Rank</th><th>Posting</th><th>Score</th><th>Missing kw</th></tr>
                </thead>
                <tbody>
                  {batchResults.map((r, i) => (
                    <tr key={r.id}>
                      <td>{i + 1}</td>
                      <td>{r.title}</td>
                      <td className="rank-score" style={{ color: r.score >= 75 ? 'var(--signal)' : r.score >= 50 ? 'var(--warn)' : 'var(--fail)' }}>{r.score}</td>
                      <td>{r.missingCount}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        )}
      </div>

      <div className="card ai-card">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 }}>
          <h3 style={{ marginBottom: 0 }}>Use your own AI (optional)</h3>
          <button className={"collapse-toggle ai-toggle" + (aiOpen ? ' open' : '')} onClick={() => setAiOpen(!aiOpen)}>
            <span className="chev">▸</span> {aiOpen ? 'Hide' : 'Show steps'}
          </button>
        </div>

        {aiOpen && (
          <div className="ai-steps" style={{ marginTop: 16 }}>
            <p className="ai-note">
              Local Mode (above) is free and works for everyone, but it's just a word-match count. For a deeper score — relevance, keyword gaps, a tailored summary, bullet rewrite suggestions — use any AI you already have (ChatGPT, Claude, Gemini, a local model, anything with a chat box). We never see the prompt or the reply; this only happens if you copy and paste it yourself, and it's sent to whichever AI service you choose, not to ResumeChkr.
            </p>

            <div>
              <span className="ai-step-label">Step 1 — copy this prompt</span>
              <div>
                <button className="copy-btn" disabled={!canScan} onClick={copyAiPrompt}>Copy prompt</button>
                {aiCopied && <span className="copied-msg">Copied!</span>}
              </div>
              {!canScan && <div style={{ fontSize: 12, color: 'var(--ink-dim)', marginTop: 6 }}>Fill in both the job posting and resume above first.</div>}
            </div>

            <div>
              <span className="ai-step-label">Step 2 — paste it into your AI</span>
              <p style={{ fontSize: 12.5, color: 'var(--ink-dim)', margin: 0 }}>Paste the copied prompt into ChatGPT, Claude, Gemini, or whichever AI chat you use, and send it.</p>
            </div>

            <div>
              <span className="ai-step-label">Step 3 — paste its reply back here</span>
              <textarea placeholder="Paste the AI's full response here…" value={aiResponseText} onChange={e => setAiResponseText(e.target.value)} style={{ minHeight: 120 }} />
              <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
                <button className="scan" disabled={!aiResponseText.trim()} onClick={parsePastedAiResponse}>Show results</button>
                {(aiResponseText || aiResult) && <button className="copy-btn" onClick={resetAiSection}>Clear</button>}
              </div>
              {aiError && <div className="error">{aiError}</div>}
            </div>

            {aiResult && (
              <div>
                {typeof aiResult.score === 'number' && (
                  <div className="score-row">
                    <Gauge score={aiResult.score} label="AI MATCH SCORE" />
                    <div className="score-copy">
                      <h2>How this reads to an ATS, per your AI</h2>
                      <p>Generated by the AI you pasted this into, not by ResumeChkr — treat it as one more opinion, not a verdict.</p>
                    </div>
                  </div>
                )}

                {(aiResult.matched_keywords || aiResult.missing_keywords) && (
                  <div className="grid2">
                    <div className="card">
                      <h3>Keywords found</h3>
                      <div className="kw-list">
                        {(aiResult.matched_keywords || []).map((k, i) => <span key={i} className="kw matched">{k}</span>)}
                        {(!aiResult.matched_keywords || aiResult.matched_keywords.length === 0) && <span style={{ color: 'var(--ink-dim)', fontSize: '13px' }}>None listed.</span>}
                      </div>
                    </div>
                    <div className="card">
                      <h3>Keywords missing</h3>
                      <div className="kw-list">
                        {(aiResult.missing_keywords || []).map((k, i) => <span key={i} className="kw missing">{k}</span>)}
                        {(!aiResult.missing_keywords || aiResult.missing_keywords.length === 0) && <span style={{ color: 'var(--ink-dim)', fontSize: '13px' }}>None listed.</span>}
                      </div>
                    </div>
                  </div>
                )}

                {aiResult.summary_rewrite && (
                  <div className="card" style={{ marginTop: 16 }}>
                    <h3>Tailored summary suggestion</h3>
                    <div className="summary-box">{aiResult.summary_rewrite}</div>
                    <button className="copy-btn" onClick={() => navigator.clipboard.writeText(aiResult.summary_rewrite)}>Copy</button>
                  </div>
                )}

                {aiResult.bullet_rewrites && aiResult.bullet_rewrites.length > 0 && (
                  <div className="card" style={{ marginTop: 16 }}>
                    <h3>Bullet rewrite suggestions</h3>
                    {aiResult.bullet_rewrites.map((b, i) => (
                      <div key={i} className="rewrite">
                        <div className="before">{b.before}</div>
                        <div className="after">→ {b.after}</div>
                        <div className="why">{b.why}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        )}
      </div>

      <div className="card ai-card">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 }}>
          <h3 style={{ marginBottom: 0 }}>Cover letter &amp; LinkedIn headline (optional, your own AI)</h3>
          <button className={"collapse-toggle cl-toggle" + (clOpen ? ' open' : '')} onClick={() => setClOpen(!clOpen)}>
            <span className="chev">▸</span> {clOpen ? 'Hide' : 'Show steps'}
          </button>
        </div>

        {clOpen && (
          <div className="ai-steps" style={{ marginTop: 16 }}>
            <p className="ai-note">
              Same bring-your-own-AI approach as above: this builds a prompt tailored to the posting and resume you've pasted in, asking for a cover letter draft and two LinkedIn headline options. We never see the prompt or the reply — it only goes to whichever AI you paste it into.
            </p>
            <div>
              <span className="ai-step-label">Step 1 — copy this prompt</span>
              <div>
                <button className="copy-btn" disabled={!canScan} onClick={copyClPrompt}>Copy prompt</button>
                {clCopied && <span className="copied-msg">Copied!</span>}
              </div>
              {!canScan && <div style={{ fontSize: 12, color: 'var(--ink-dim)', marginTop: 6 }}>Fill in both the job posting and resume above first.</div>}
            </div>
            <div>
              <span className="ai-step-label">Step 2 — paste it into your AI</span>
              <p style={{ fontSize: 12.5, color: 'var(--ink-dim)', margin: 0 }}>Paste into ChatGPT, Claude, Gemini, or whichever AI chat you use, and send it.</p>
            </div>
            <div>
              <span className="ai-step-label">Step 3 — paste its reply back here</span>
              <textarea placeholder="Paste the AI's full response here…" value={clResponseText} onChange={e => setClResponseText(e.target.value)} style={{ minHeight: 120 }} />
              <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
                <button className="scan" disabled={!clResponseText.trim()} onClick={parsePastedClResponse}>Show results</button>
                {(clResponseText || clResult) && <button className="copy-btn" onClick={resetClSection}>Clear</button>}
              </div>
              {clError && <div className="error">{clError}</div>}
            </div>

            {clResult && (
              <div>
                {clResult.cover_letter && (
                  <div className="card" style={{ marginTop: 6 }}>
                    <h3>Cover letter draft</h3>
                    <div className="summary-box" style={{ whiteSpace: 'pre-wrap' }}>{clResult.cover_letter}</div>
                    <button className="copy-btn" onClick={() => navigator.clipboard.writeText(clResult.cover_letter)}>Copy</button>
                  </div>
                )}
                {(clResult.linkedin_headline || clResult.headline_alt) && (
                  <div className="card" style={{ marginTop: 16 }}>
                    <h3>LinkedIn headline options</h3>
                    {clResult.linkedin_headline && (
                      <div className="rewrite">
                        <div className="after">{clResult.linkedin_headline}</div>
                        <button className="copy-btn" onClick={() => navigator.clipboard.writeText(clResult.linkedin_headline)}>Copy</button>
                      </div>
                    )}
                    {clResult.headline_alt && (
                      <div className="rewrite">
                        <div className="after">{clResult.headline_alt}</div>
                        <button className="copy-btn" onClick={() => navigator.clipboard.writeText(clResult.headline_alt)}>Copy</button>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </div>
        )}
      </div>

      {phase === 'scanning' && (
        <div className="scanning-box">
          <div className="laser"></div>
          <div className="scan-lines">
            {scanLines.map((l, i) => <div key={i} className="ok" style={{ animationDelay: (i * 0.15) + 's' }}>{l}</div>)}
          </div>
        </div>
      )}

      {phase === 'done' && checks.length > 0 && (
        <div className="results" style={{ display: 'block' }}>
          {overlap && (
            <div className="score-row">
              <Gauge score={overlap.score} />
              <div className="score-copy">
                <h2>Local Mode: keyword overlap with this posting</h2>
                <p>
                  {overlap.score >= 75 ? 'Strong overlap — most of the posting\'s key terms show up in your resume.' : overlap.score >= 50 ? 'Partial overlap — a keyword-based ATS will find some matches, but several important terms are missing.' : 'Low overlap — a keyword-based ATS may rank this resume low for this specific posting.'}
                  {' '}This is a simple word-match count, not an AI judgment of quality or fit — Local Mode can't tell relevance, tone, or seniority apart. For that, try "Use your own AI" above.
                  {overlap.hasPreferredSection ? ' This posting has a separate "nice to have" section, so — mirroring how Greenhouse\'s own recruiter keyword search treats "Required" vs "Preferred" terms — required terms count double toward this score.' : ''}
                </p>
              </div>
            </div>
          )}

          <div className="card" style={{ marginBottom: 16 }}>
            <h3>Formatting &amp; parseability</h3>
            {checks.map((c, i) => (
              <div key={i} className={"check-item " + c.status}>
                <div className="dot"></div>
                <div className="txt"><b>{c.label} — {c.detail}</b><span>{c.note}</span></div>
              </div>
            ))}
          </div>

          <div className="card" style={{ marginBottom: 16 }}>
            <h3>ATS parsing simulation</h3>
            <div className="platform-toggle">
              {Object.keys(PLATFORM_INFO).map(p => (
                <button key={p} className={"platform-btn" + (atsPlatform === p ? ' active' : '')} onClick={() => setAtsPlatform(p)}>
                  {PLATFORM_INFO[p].name}
                </button>
              ))}
            </div>
            <p className="platform-note">{PLATFORM_INFO[atsPlatform].blurb} This is a simulation based on each platform's documented parsing behavior, not a call to either vendor's real parser — treat it as a best-effort estimate of how your resume's structure would come through, not a guarantee.</p>
            {(() => {
              const sim = simulateAtsParse(resume, atsPlatform);
              return (
                <React.Fragment>
                  <div className="parse-sim">
                    {sim.fields.map((f, i) => (
                      <div key={i} className="parse-field">
                        <span className="fkey">{f.key}</span>
                        <span className={"fval " + (f.cls === 'fail' ? 'broken' : f.cls === 'warn' ? 'shaky' : f.cls === 'pass' ? '' : 'empty')}>{f.val}</span>
                      </div>
                    ))}
                  </div>
                  {sim.risks.map((r, i) => (
                    <div key={i} className={"check-item " + r.status}>
                      <div className="dot"></div>
                      <div className="txt"><b>{r.label}</b><span>{r.detail}</span></div>
                    </div>
                  ))}
                </React.Fragment>
              );
            })()}
          </div>

          {knockouts.length > 0 && (
            <div className="card" style={{ marginBottom: 16 }}>
              <h3>Possible knockout requirements</h3>
              <p className="improve-note">
                Some ATS platforms — Workable, for one — support yes/no "knockout questions" on the application form that auto-reject a candidate before a human ever opens the resume, completely separate from any keyword score. We can't see the actual application form, but this posting contains language that commonly maps to that kind of hard requirement. Make sure you can honestly answer yes before applying:
              </p>
              {knockouts.map((k, i) => (
                <div key={i} className="check-item warn">
                  <div className="dot"></div>
                  <div className="txt"><b>{k.label}</b><span>{k.snippet}</span></div>
                </div>
              ))}
            </div>
          )}

          {overlap && (
            <div className="grid2">
              <div className="card">
                <h3>Keywords found ({overlap.matched.length})</h3>
                {overlap.hasPreferredSection ? (
                  <React.Fragment>
                    <KwGroup label="Required (2x weight)" items={overlap.requiredMatched} cls="matched" emptyText="None detected." />
                    <KwGroup label="Preferred / nice-to-have" items={overlap.preferredMatched} cls="matched" emptyText="None detected." />
                  </React.Fragment>
                ) : (
                  <div className="kw-list">
                    {overlap.matched.map((k, i) => <span key={i} className="kw matched">{k}</span>)}
                    {overlap.matched.length === 0 && <span style={{color:'var(--ink-dim)', fontSize:'13px'}}>None detected.</span>}
                  </div>
                )}
              </div>
              <div className="card">
                <h3>Keywords missing ({overlap.missing.length})</h3>
                {overlap.hasPreferredSection ? (
                  <React.Fragment>
                    <KwGroup label="Required (2x weight)" items={overlap.requiredMissing} cls="missing" emptyText="None — good coverage." />
                    <KwGroup label="Preferred / nice-to-have" items={overlap.preferredMissing} cls="missing" emptyText="None — good coverage." />
                  </React.Fragment>
                ) : (
                  <div className="kw-list">
                    {overlap.missing.map((k, i) => <span key={i} className="kw missing">{k}</span>)}
                    {overlap.missing.length === 0 && <span style={{color:'var(--ink-dim)', fontSize:'13px'}}>None — good coverage.</span>}
                  </div>
                )}
              </div>
            </div>
          )}

          {overlap && overlap.missing.length > 0 && (
            <div className="card improve-card">
              <h3>Improve your match score</h3>
              <p className="improve-note">
                These terms from the job posting weren't found in your resume. If they honestly reflect your experience, work them into your Skills section or naturally into a bullet point — each one you genuinely add raises your keyword-overlap score. Don't list a skill you don't actually have; keyword matching only helps if you can back it up when asked about it.
              </p>
              {overlap.hasPreferredSection ? (
                <React.Fragment>
                  <KwGroup label="Required (2x weight) — fix these first" items={overlap.requiredMissing} cls="missing" emptyText="None — all required terms are covered." />
                  <KwGroup label="Preferred / nice-to-have" items={overlap.preferredMissing} cls="missing" emptyText="None — good coverage." />
                </React.Fragment>
              ) : (
                <div className="kw-list" style={{ marginBottom: 12 }}>
                  {overlap.missing.map((k, i) => <span key={i} className="kw missing">{k}</span>)}
                </div>
              )}
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
                <button className="copy-btn" onClick={copyMissingKeywords}>Copy missing keywords</button>
                <button className="copy-btn" onClick={focusResume}>Edit my resume ↑</button>
                {missingCopied && <span className="copied-msg">Copied!</span>}
              </div>
            </div>
          )}

          {overlap && overlap.missing.length === 0 && (
            <div className="card improve-card">
              <h3>Improve your match score</h3>
              <p className="improve-note" style={{ marginBottom: 0 }}>
                Every extracted keyword from this posting already appears in your resume — good coverage. From here, the formatting checks above are the next place to look for score gains.
              </p>
            </div>
          )}

          <div className="card" style={{ marginBottom: 16 }}>
            <h3>Tailored versions for this posting</h3>
            <p className="improve-note">
              Save a snapshot of your resume text as-is after you've tailored it for this posting, so you can come back and reload it instead of re-writing from scratch for the next similar role.
            </p>
            <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: versions.length ? 4 : 0 }}>
              <button className="copy-btn" onClick={saveVersion}>Save this version</button>
              {versionSaved && <span className="copied-msg">Saved!</span>}
            </div>
            {versions.length > 0 && (
              <div className="version-list">
                {versions.map(v => (
                  <div key={v.id} className="version-item">
                    <div className="version-score" style={{ color: v.score >= 75 ? 'var(--signal)' : v.score >= 50 ? 'var(--warn)' : 'var(--fail)' }}>{v.score}</div>
                    <div className="version-main">
                      <span className="version-title">{v.title}</span>
                      <span className="version-meta">{new Date(v.savedAt).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</span>
                    </div>
                    <div className="history-actions">
                      <button className="applied-btn" onClick={() => loadVersion(v.id)}>Reload into editor</button>
                      <button className="history-delete" onClick={() => deleteVersion(v.id)} title="Delete version" aria-label="Delete version">×</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
            <p className="session-note">Saved versions live only in this browser tab for this session — they're not written to disk and clear on reload.</p>
          </div>
        </div>
      )}

      <footer className="site-footer">
        <div className="footer-legal-links">
          <a href="legal.html#privacy">Privacy</a>
          <a href="legal.html#terms">Terms</a>
          <a href="legal.html#disclaimer">Disclaimer</a>
        </div>
        <p style={{ fontSize: 11, color: 'var(--ink-dim)', opacity: 0.7, marginTop: 4 }}>© {new Date().getFullYear()} ResumeChkr. Last updated {LAST_UPDATED}.</p>
      </footer>

      {cookieBannerOpen && (
        <div className="cookie-banner" role="dialog" aria-label="Cookie notice">
          <div className="cookie-box">
            <div className="cookie-text">
              <p className="cookie-title">🍪 We use cookies</p>
              <p>ResumeChkr never sees your resume or job posting text — that stays local. We do use Google Analytics for aggregate traffic stats, which sets a standard analytics cookie only if you accept. See <a href="legal.html#privacy">our privacy page</a> for details.</p>
            </div>
            <div className="cookie-actions">
              <button type="button" className="cookie-reject" onClick={() => chooseCookies('rejected')}>Reject</button>
              <button type="button" className="cookie-accept" onClick={() => chooseCookies('accepted')}>Accept</button>
            </div>
          </div>
        </div>
      )}
      {!cookieBannerOpen && (
        <button type="button" className="cookie-settings-btn" onClick={() => setCookieBannerOpen(true)}>Cookie Settings</button>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('ats-root')).render(<App />);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</body>
</html>
