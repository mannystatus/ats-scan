<script type="text/babel" data-presets="react">
const { useState, useRef } = React;
const LAST_UPDATED = 'July 24, 2026';

function Gauge({ score, label }) {
  const r = 60, c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(100, score));
  const offset = c - (pct / 100) * c;
  const color = pct >= 75 ? '#3DDC84' : pct >= 50 ? '#F5A623' : '#FF5470';
  return (
    <div className="gauge">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="70" cy="70" r={r} fill="none" stroke="#232E3A" strokeWidth="10" />
        <circle cx="70" cy="70" r={r} fill="none" stroke={color} strokeWidth="10"
          strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
          style={{ transition: 'stroke-dashoffset 0.8s ease' }} />
      </svg>
      <div className="num">
        {pct}<small>{label || 'KEYWORD MATCH'}</small>
      </div>
    </div>
  );
}

function localChecks(resume) {
  const checks = [];
  const wc = resume.trim().split(/\s+/).filter(Boolean).length;
  checks.push({
    label: 'Length',
    detail: wc + ' words',
    status: wc < 250 ? 'warn' : wc > 1100 ? 'warn' : 'pass',
    note: wc < 250 ? 'May be too thin for the role — consider adding detail.' : wc > 1100 ? 'Trim toward 1-2 pages for most ATS readers.' : 'Reasonable length for one to two pages.'
  });
  const hasEmail = /[\w.+-]+@[\w-]+\.[a-zA-Z]{2,}/.test(resume);
  checks.push({ label: 'Email address', detail: hasEmail ? 'found' : 'not found', status: hasEmail ? 'pass' : 'fail', note: hasEmail ? 'Parsers can pull your contact info.' : 'Add a plain-text email near the top.' });
  const hasPhone = /(\+?\d[\d\s().-]{7,}\d)/.test(resume);
  checks.push({ label: 'Phone number', detail: hasPhone ? 'found' : 'not found', status: hasPhone ? 'pass' : 'warn', note: hasPhone ? 'Phone number is machine-readable.' : 'Consider adding a phone number.' });
  const sectionWords = ['experience', 'education', 'skills', 'summary', 'work history', 'employment'];
  const lower = resume.toLowerCase();
  const foundSections = sectionWords.filter(w => lower.includes(w));
  checks.push({
    label: 'Standard section headers',
    detail: foundSections.length + ' of ' + sectionWords.length + ' common headers detected',
    status: foundSections.length >= 3 ? 'pass' : 'warn',
    note: foundSections.length >= 3 ? 'ATS parsers recognize these section names.' : 'Use standard headers like "Experience", "Education", "Skills" so parsers can map your content.'
  });
  const bulletCount = (resume.match(/^[\s]*[•\-\*]/gm) || []).length;
  checks.push({
    label: 'Bullet points',
    detail: bulletCount + ' detected',
    status: bulletCount >= 4 ? 'pass' : 'warn',
    note: bulletCount >= 4 ? 'Bulleted achievements parse cleanly.' : 'Bullet points (using -, *, or •) parse more reliably than dense paragraphs.'
  });
  const hasTabsOrOddSpacing = /\t/.test(resume) || /\s{4,}\S/.test(resume);
  checks.push({
    label: 'Layout artifacts',
    detail: hasTabsOrOddSpacing ? 'irregular spacing detected' : 'clean',
    status: hasTabsOrOddSpacing ? 'warn' : 'pass',
    note: hasTabsOrOddSpacing ? 'Tabs or wide gaps often come from tables/columns, which many ATS parsers scramble. Prefer a single-column layout.' : 'No signs of multi-column or table layout in the pasted text.'
  });
  const specialChars = (resume.match(/[^\x00-\x7F]/g) || []).filter(c => !/[•]/.test(c));
  checks.push({
    label: 'Special characters',
    detail: specialChars.length + ' non-standard characters',
    status: specialChars.length > 15 ? 'warn' : 'pass',
    note: specialChars.length > 15 ? 'Icons, symbols, or smart-quotes can render as garbage in some parsers.' : 'Mostly standard characters — safe for parsing.'
  });
  return checks;
}

function statusRank(s) { return s === 'fail' ? 0 : s === 'warn' ? 1 : 2; }

// --- Local (non-AI) keyword overlap: a plain lexical heuristic, same idea a
// keyword-based ATS uses — count meaningful terms in the posting, see which
// literally appear in the resume. No network calls, no AI involved. ---

const STOPWORDS = new Set([
  'a','about','above','after','again','against','all','am','an','and','any','are','as','at','be','because',
  'been','before','being','below','between','both','but','by','can','could','did','do','does','doing','down',
  'during','each','few','for','from','further','had','has','have','having','he','her','here','hers','herself',
  'him','himself','his','how','i','if','in','into','is','it','its','itself','just','me','more','most','my',
  'myself','no','nor','not','now','of','off','on','once','only','or','other','our','ours','ourselves','out',
  'over','own','same','she','should','so','some','such','than','that','the','their','theirs','them',
  'themselves','then','there','these','they','this','those','through','to','too','under','until','up','very',
  'was','we','were','what','when','where','which','while','who','whom','why','will','with','would','you',
  'your','yours','yourself','yourselves',
  'also','etc','per','using','use','used','across','within','including','include','includes','looking',
  'seeking','required','preferred','strong','excellent','ability','abilities','years','year','experience',
  'experienced','work','working','works','job','jobs','role','roles','team','teams','company','companies',
  'candidate','candidates','position','positions','responsibilities','requirements','qualifications','skills',
  'skill','knowledge','understanding','plus','must','ideal','join','new','help','provide','related','apply',
  'benefits','equal','opportunity','employer','nice','familiarity','familiar'
]);
const SHORT_ALLOW = new Set(['ai', 'ml', 'ux', 'ui', 'qa', 'pm', 'bi', 'it']);

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function extractKeywords(jd) {
  const raw = jd.match(/[a-zA-Z][a-zA-Z0-9+.#-]*/g) || [];
  const freq = new Map();
  for (const w of raw) {
    const token = w.toLowerCase().replace(/^[.#-]+|[.#-]+$/g, '');
    if (!token) continue;
    if (token.length < 3 && !SHORT_ALLOW.has(token)) continue;
    if (STOPWORDS.has(token)) continue;
    if (/^\d+$/.test(token)) continue;
    freq.set(token, (freq.get(token) || 0) + 1);
  }
  return [...freq.entries()]
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .slice(0, 20)
    .map(([term]) => term);
}

function tokenAppears(token, text) {
  if (/^[a-z0-9]+$/i.test(token)) {
    return new RegExp('\\b' + escapeRegex(token) + '\\b', 'i').test(text);
  }
  return text.toLowerCase().includes(token.toLowerCase());
}

function keywordOverlap(jd, resume) {
  const keywords = extractKeywords(jd);
  if (keywords.length === 0) return null;
  const matched = keywords.filter(k => tokenAppears(k, resume));
  const missing = keywords.filter(k => !matched.includes(k));
  const score = Math.round((matched.length / keywords.length) * 100);
  return { score, matched, missing };
}

// --- Bring-your-own-AI bridge -----------------------------------------
// We never call any AI service ourselves. Instead we build a plain-text
// prompt the user copies into whatever AI they already have (ChatGPT,
// Claude, Gemini, a local model, anything with a chat box), and parse
// whatever JSON that AI hands back. No API key, no CORS, no provider
// lock-in, and nothing leaves this page unless the user pastes it
// somewhere else themselves.

function buildAiPrompt(jd, resume) {
  return `You are an ATS resume analyst. Compare the RESUME to the JOB POSTING.
Return ONLY raw JSON (no markdown fences, no preamble, no commentary before or after) matching exactly this shape:
{"score": <0-100 integer, how well resume matches posting for ATS + relevance>,
"matched_keywords": [<up to 10 important terms from the posting that appear in the resume>],
"missing_keywords": [<up to 10 important terms/skills from the posting NOT found in the resume>],
"summary_rewrite": "<a tightened 2-3 sentence professional summary tailored to this posting, based on the resume's real background>",
"bullet_rewrites": [{"before": "<a real bullet-ish line from the resume, verbatim or close>", "after": "<rewritten version that adds a missing keyword naturally and is more quantified>", "why": "<one short sentence>"} - up to 4 items]}
Keep every string concise. Do not invent employers, titles, or metrics not implied by the resume.

JOB POSTING:
${jd.slice(0, 6000)}

RESUME:
${resume.slice(0, 6000)}`;
}

function parseAiResponse(raw) {
  let text = (raw || '').trim();
  if (!text) throw new Error('empty');
  text = text.replace(/```json/gi, '').replace(/```/g, '').trim();
  try {
    return JSON.parse(text);
  } catch (e) {
    const match = text.match(/\{[\s\S]*\}/);
    if (match) {
      try { return JSON.parse(match[0]); } catch (e2) { /* fall through */ }
    }
    throw new Error('unparsable');
  }
}

// --- Scan history --------------------------------------------------------
// Stored in localStorage only — never sent anywhere. We deliberately save
// just a title snippet + score + applied status, not the full resume or
// job posting text, to keep what's persisted on disk minimal.

const HISTORY_KEY = 'ats-scan-history-v1';

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}

function saveHistory(list) {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
  } catch (e) { /* storage unavailable (private mode, quota, etc.) — skip silently */ }
}

function jdTitleFrom(jd) {
  const line = (jd.split('\n').find(l => l.trim().length > 3) || '').trim();
  if (!line) return 'Untitled posting';
  return line.length > 90 ? line.slice(0, 90) + '…' : line;
}

function App() {
  const [jd, setJd] = useState('');
  const [resume, setResume] = useState('');
  const [phase, setPhase] = useState('idle'); // idle | scanning | done
  const [checks, setChecks] = useState([]);
  const [overlap, setOverlap] = useState(null);
  const [jdUrl, setJdUrl] = useState('');
  const [urlPhase, setUrlPhase] = useState('idle'); // idle | fetching | error
  const [urlErr, setUrlErr] = useState('');
  const [missingCopied, setMissingCopied] = useState(false);
  const resumeRef = useRef(null);
  const scanLines = ['Reading job posting', 'Reading resume', 'Checking formatting', 'Extracting keywords', 'Comparing overlap'];

  const [history, setHistory] = useState(() => loadHistory());
  const [historyOpen, setHistoryOpen] = useState(false);

  const [aiOpen, setAiOpen] = useState(false);
  const [aiCopied, setAiCopied] = useState(false);
  const [aiResponseText, setAiResponseText] = useState('');
  const [aiResult, setAiResult] = useState(null);
  const [aiError, setAiError] = useState('');

  function stripHtml(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script, style, noscript, svg, header, footer, nav').forEach(el => el.remove());
    const text = doc.body ? doc.body.innerText : '';
    return text.replace(/\n{3,}/g, '\n\n').replace(/[ \t]{2,}/g, ' ').trim();
  }

  async function fetchJobFromUrl() {
    const url = jdUrl.trim();
    if (!url) return;
    setUrlPhase('fetching');
    setUrlErr('');
    try {
      const res = await fetch(url, { mode: 'cors' });
      if (!res.ok) throw new Error('status ' + res.status);
      const html = await res.text();
      const text = stripHtml(html);
      if (text.length > 200) {
        setJd(text.slice(0, 8000));
        setUrlPhase('idle');
        return;
      }
      throw new Error('page text too short');
    } catch (e) {
      setUrlPhase('error');
      setUrlErr("Couldn't pull that page automatically — most job sites block cross-origin requests from the browser. Paste the posting text into the box below instead.");
    }
  }

  function runScan() {
    if (!jd.trim() || !resume.trim()) return;
    setPhase('scanning');
    const local = localChecks(resume).sort((a, b) => statusRank(a.status) - statusRank(b.status));
    const kw = keywordOverlap(jd, resume);
    // Small delay purely so the scan animation is visible — everything here
    // already ran synchronously in the browser.
    setTimeout(() => {
      setChecks(local);
      setOverlap(kw);
      setPhase('done');
      if (kw) {
        const entry = {
          id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
          date: Date.now(),
          title: jdTitleFrom(jd),
          score: kw.score,
          applied: false,
          appliedAt: null,
        };
        setHistory(h => {
          const next = [entry, ...h].slice(0, 200);
          saveHistory(next);
          return next;
        });
      }
    }, 900);
  }

  function toggleApplied(id) {
    setHistory(h => {
      const next = h.map(e => e.id === id ? { ...e, applied: !e.applied, appliedAt: !e.applied ? Date.now() : null } : e);
      saveHistory(next);
      return next;
    });
  }

  function deleteHistoryEntry(id) {
    setHistory(h => {
      const next = h.filter(e => e.id !== id);
      saveHistory(next);
      return next;
    });
  }

  function clearHistory() {
    if (!window.confirm('Clear your entire scan history? This can\'t be undone.')) return;
    setHistory([]);
    saveHistory([]);
  }

  async function copyMissingKeywords() {
    if (!overlap || overlap.missing.length === 0) return;
    try {
      await navigator.clipboard.writeText(overlap.missing.join(', '));
      setMissingCopied(true);
      setTimeout(() => setMissingCopied(false), 2200);
    } catch (e) { /* clipboard permission denied — silently ignore */ }
  }

  function focusResume() {
    if (!resumeRef.current) return;
    resumeRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' });
    resumeRef.current.focus({ preventScroll: true });
  }

  async function copyAiPrompt() {
    try {
      await navigator.clipboard.writeText(buildAiPrompt(jd, resume));
      setAiCopied(true);
      setTimeout(() => setAiCopied(false), 2500);
    } catch (e) {
      setAiError("Couldn't copy automatically — select the prompt text and copy it manually.");
    }
  }

  function parsePastedAiResponse() {
    setAiError('');
    try {
      const parsed = parseAiResponse(aiResponseText);
      if (typeof parsed.score !== 'number' && !parsed.matched_keywords && !parsed.summary_rewrite) {
        throw new Error('shape');
      }
      setAiResult(parsed);
    } catch (e) {
      setAiResult(null);
      setAiError("Couldn't read that as the expected JSON. Make sure you pasted the AI's full reply, and that it returned only the JSON object with no extra text around it — then try again.");
    }
  }

  function resetAiSection() {
    setAiResponseText('');
    setAiResult(null);
    setAiError('');
  }

  const canScan = jd.trim().length > 20 && resume.trim().length > 20;

  return (
    <div className="wrap">
      <div className="masthead">
        <div className="brand">
          <img className="brand-mark" src="logo-lockup.svg" alt="mcx.pro" />
          <div className="brand-div"></div>
          <h1>ATS<span>·</span>Scan</h1>
        </div>
        <div className="masthead-right">
          <div className="tag">resume × job posting compatibility</div>
          <a className="patreon-link" href="https://patreon.com/MCXLABS?utm_medium=unknown&utm_source=join_link&utm_campaign=creatorshare_creator&utm_content=copyLink" target="_blank" rel="noopener noreferrer">♥ Support on Patreon</a>
        </div>
      </div>
      <div className="privacy-note"><span className="dot"></span>Runs entirely in your browser — your resume and job posting stay on your device and are never sent to ATS Scan or anyone else.</div>

      <div className="card history-card">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 }}>
          <h3 style={{ marginBottom: 0 }}>Your scan history ({history.length})</h3>
          <button className={"collapse-toggle history-toggle" + (historyOpen ? ' open' : '')} onClick={() => setHistoryOpen(!historyOpen)}>
            <span className="chev">▸</span> {historyOpen ? 'Hide' : 'Show'}
          </button>
        </div>

        {historyOpen && (
          <div style={{ marginTop: 16 }}>
            <p className="history-note">
              Every scan is saved here automatically so you can track which postings you've checked and mark the ones you've applied to. Only the posting's title line, the date, and your score are saved — never the full resume or posting text — and it's all stored in this browser only (localStorage), never sent to ATS Scan.
            </p>

            {history.length === 0 && (
              <div className="history-empty">No scans yet — run one below and it'll show up here.</div>
            )}

            {history.length > 0 && (
              <React.Fragment>
                <div className="history-list">
                  {history.map(h => (
                    <div key={h.id} className={"history-item" + (h.applied ? ' applied' : '')}>
                      <div className="history-score" style={{ color: h.score >= 75 ? 'var(--signal)' : h.score >= 50 ? 'var(--warn)' : 'var(--fail)' }}>{h.score}</div>
                      <div className="history-main">
                        <span className="history-title">{h.title}</span>
                        <span className="history-date">
                          {new Date(h.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}
                          {h.applied && h.appliedAt ? ' · applied ' + new Date(h.appliedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : ''}
                        </span>
                      </div>
                      <div className="history-actions">
                        <button className={"applied-btn" + (h.applied ? ' is-applied' : '')} onClick={() => toggleApplied(h.id)}>
                          {h.applied ? '✓ Applied' : 'Mark applied'}
                        </button>
                        <button className="history-delete" onClick={() => deleteHistoryEntry(h.id)} title="Remove from history" aria-label="Remove from history">×</button>
                      </div>
                    </div>
                  ))}
                </div>
                <button className="copy-btn" onClick={clearHistory}>Clear history</button>
              </React.Fragment>
            )}
          </div>
        )}
      </div>

      <div className="panes">
        <div className="pane">
          <label>Job Posting</label>
          <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
            <input
              type="text"
              placeholder="Paste job posting URL…"
              value={jdUrl}
              onChange={e => setJdUrl(e.target.value)}
              style={{ flex: 1, background: 'var(--panel-2)', border: '1px solid var(--line)', borderRadius: 8, color: 'var(--ink)', fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, padding: '9px 10px', outline: 'none' }}
            />
            <button className="copy-btn" style={{ padding: '0 14px' }} disabled={!jdUrl.trim() || urlPhase === 'fetching'} onClick={fetchJobFromUrl}>
              {urlPhase === 'fetching' ? 'Fetching…' : 'Fetch'}
            </button>
          </div>
          {urlPhase === 'error' && <div className="error" style={{ padding: '0 0 8px' }}>{urlErr}</div>}
          <textarea placeholder="Paste the full job posting text here…" value={jd} onChange={e => setJd(e.target.value)} />
        </div>
        <div className="pane">
          <label>Your Resume</label>
          <textarea ref={resumeRef} placeholder="Paste your resume text here…" value={resume} onChange={e => setResume(e.target.value)} />
        </div>
      </div>

      <div className="scan-row">
        <button className="scan" disabled={!canScan || phase === 'scanning'} onClick={runScan}>
          {phase === 'scanning' ? 'Scanning…' : 'Run scan'}
        </button>
        <span className="mode-badge">Local mode · no AI account needed</span>
      </div>
      <p className="scan-hint" style={{ margin: '-14px 0 30px' }}>
        Paste plain text (not a PDF) for the most accurate check. This runs entirely on your device and works for everyone, free — but it only counts word matches, so results are more limited than an AI-generated score. For a deeper analysis, see "Use your own AI" below.
      </p>

      <div className="card ai-card">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 }}>
          <h3 style={{ marginBottom: 0 }}>Use your own AI (optional)</h3>
          <button className={"collapse-toggle ai-toggle" + (aiOpen ? ' open' : '')} onClick={() => setAiOpen(!aiOpen)}>
            <span className="chev">▸</span> {aiOpen ? 'Hide' : 'Show steps'}
          </button>
        </div>

        {aiOpen && (
          <div className="ai-steps" style={{ marginTop: 16 }}>
            <p className="ai-note">
              Local Mode (above) is free and works for everyone, but it's just a word-match count. For a deeper score — relevance, keyword gaps, a tailored summary, bullet rewrite suggestions — use any AI you already have (ChatGPT, Claude, Gemini, a local model, anything with a chat box). We never see the prompt or the reply; this only happens if you copy and paste it yourself, and it's sent to whichever AI service you choose, not to ATS Scan.
            </p>

            <div>
              <span className="ai-step-label">Step 1 — copy this prompt</span>
              <div>
                <button className="copy-btn" disabled={!canScan} onClick={copyAiPrompt}>Copy prompt</button>
                {aiCopied && <span className="copied-msg">Copied!</span>}
              </div>
              {!canScan && <div style={{ fontSize: 12, color: 'var(--ink-dim)', marginTop: 6 }}>Fill in both the job posting and resume above first.</div>}
            </div>

            <div>
              <span className="ai-step-label">Step 2 — paste it into your AI</span>
              <p style={{ fontSize: 12.5, color: 'var(--ink-dim)', margin: 0 }}>Paste the copied prompt into ChatGPT, Claude, Gemini, or whichever AI chat you use, and send it.</p>
            </div>

            <div>
              <span className="ai-step-label">Step 3 — paste its reply back here</span>
              <textarea placeholder="Paste the AI's full response here…" value={aiResponseText} onChange={e => setAiResponseText(e.target.value)} style={{ minHeight: 120 }} />
              <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
                <button className="scan" disabled={!aiResponseText.trim()} onClick={parsePastedAiResponse}>Show results</button>
                {(aiResponseText || aiResult) && <button className="copy-btn" onClick={resetAiSection}>Clear</button>}
              </div>
              {aiError && <div className="error">{aiError}</div>}
            </div>

            {aiResult && (
              <div>
                {typeof aiResult.score === 'number' && (
                  <div className="score-row">
                    <Gauge score={aiResult.score} label="AI MATCH SCORE" />
                    <div className="score-copy">
                      <h2>How this reads to an ATS, per your AI</h2>
                      <p>Generated by the AI you pasted this into, not by ATS Scan — treat it as one more opinion, not a verdict.</p>
                    </div>
                  </div>
                )}

                {(aiResult.matched_keywords || aiResult.missing_keywords) && (
                  <div className="grid2">
                    <div className="card">
                      <h3>Keywords found</h3>
                      <div className="kw-list">
                        {(aiResult.matched_keywords || []).map((k, i) => <span key={i} className="kw matched">{k}</span>)}
                        {(!aiResult.matched_keywords || aiResult.matched_keywords.length === 0) && <span style={{ color: 'var(--ink-dim)', fontSize: '13px' }}>None listed.</span>}
                      </div>
                    </div>
                    <div className="card">
                      <h3>Keywords missing</h3>
                      <div className="kw-list">
                        {(aiResult.missing_keywords || []).map((k, i) => <span key={i} className="kw missing">{k}</span>)}
                        {(!aiResult.missing_keywords || aiResult.missing_keywords.length === 0) && <span style={{ color: 'var(--ink-dim)', fontSize: '13px' }}>None listed.</span>}
                      </div>
                    </div>
                  </div>
                )}

                {aiResult.summary_rewrite && (
                  <div className="card" style={{ marginTop: 16 }}>
                    <h3>Tailored summary suggestion</h3>
                    <div className="summary-box">{aiResult.summary_rewrite}</div>
                    <button className="copy-btn" onClick={() => navigator.clipboard.writeText(aiResult.summary_rewrite)}>Copy</button>
                  </div>
                )}

                {aiResult.bullet_rewrites && aiResult.bullet_rewrites.length > 0 && (
                  <div className="card" style={{ marginTop: 16 }}>
                    <h3>Bullet rewrite suggestions</h3>
                    {aiResult.bullet_rewrites.map((b, i) => (
                      <div key={i} className="rewrite">
                        <div className="before">{b.before}</div>
                        <div className="after">→ {b.after}</div>
                        <div className="why">{b.why}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        )}
      </div>

      {phase === 'scanning' && (
        <div className="scanning-box">
          <div className="laser"></div>
          <div className="scan-lines">
            {scanLines.map((l, i) => <div key={i} className="ok" style={{ animationDelay: (i * 0.15) + 's' }}>{l}</div>)}
          </div>
        </div>
      )}

      {phase === 'done' && checks.length > 0 && (
        <div className="results" style={{ display: 'block' }}>
          {overlap && (
            <div className="score-row">
              <Gauge score={overlap.score} />
              <div className="score-copy">
                <h2>Local Mode: keyword overlap with this posting</h2>
                <p>
                  {overlap.score >= 75 ? 'Strong overlap — most of the posting\'s key terms show up in your resume.' : overlap.score >= 50 ? 'Partial overlap — a keyword-based ATS will find some matches, but several important terms are missing.' : 'Low overlap — a keyword-based ATS may rank this resume low for this specific posting.'}
                  {' '}This is a simple word-match count, not an AI judgment of quality or fit — Local Mode can't tell relevance, tone, or seniority apart. For that, try "Use your own AI" above.
                </p>
              </div>
            </div>
          )}

          <div className="card" style={{ marginBottom: 16 }}>
            <h3>Formatting &amp; parseability</h3>
            {checks.map((c, i) => (
              <div key={i} className={"check-item " + c.status}>
                <div className="dot"></div>
                <div className="txt"><b>{c.label} — {c.detail}</b><span>{c.note}</span></div>
              </div>
            ))}
          </div>

          {overlap && (
            <div className="grid2">
              <div className="card">
                <h3>Keywords found ({overlap.matched.length})</h3>
                <div className="kw-list">
                  {overlap.matched.map((k, i) => <span key={i} className="kw matched">{k}</span>)}
                  {overlap.matched.length === 0 && <span style={{color:'var(--ink-dim)', fontSize:'13px'}}>None detected.</span>}
                </div>
              </div>
              <div className="card">
                <h3>Keywords missing ({overlap.missing.length})</h3>
                <div className="kw-list">
                  {overlap.missing.map((k, i) => <span key={i} className="kw missing">{k}</span>)}
                  {overlap.missing.length === 0 && <span style={{color:'var(--ink-dim)', fontSize:'13px'}}>None — good coverage.</span>}
                </div>
              </div>
            </div>
          )}

          {overlap && overlap.missing.length > 0 && (
            <div className="card improve-card">
              <h3>Improve your match score</h3>
              <p className="improve-note">
                These terms from the job posting weren't found in your resume. If they honestly reflect your experience, work them into your Skills section or naturally into a bullet point — each one you genuinely add raises your keyword-overlap score. Don't list a skill you don't actually have; keyword matching only helps if you can back it up when asked about it.
              </p>
              <div className="kw-list" style={{ marginBottom: 12 }}>
                {overlap.missing.map((k, i) => <span key={i} className="kw missing">{k}</span>)}
              </div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
                <button className="copy-btn" onClick={copyMissingKeywords}>Copy missing keywords</button>
                <button className="copy-btn" onClick={focusResume}>Edit my resume ↑</button>
                {missingCopied && <span className="copied-msg">Copied!</span>}
              </div>
            </div>
          )}

          {overlap && overlap.missing.length === 0 && (
            <div className="card improve-card">
              <h3>Improve your match score</h3>
              <p className="improve-note" style={{ marginBottom: 0 }}>
                Every extracted keyword from this posting already appears in your resume — good coverage. From here, the formatting checks above are the next place to look for score gains.
              </p>
            </div>
          )}
        </div>
      )}

      <footer className="site-footer">
        <div>
          <h4>Your data &amp; privacy</h4>
          <p>All processing happens locally in your browser. The job posting and resume text you paste are never uploaded, transmitted, or stored on any ATS Scan server — we don't have one. We don't run analytics, don't use tracking cookies, and don't set up user accounts — nothing about your visit is tracked. Closing or reloading this page clears the text in the boxes above. The one thing that does persist is your scan history — the posting's title line, the date, and your score, saved to this browser's local storage so you can track what you've checked and applied to; it stays on this device and is never transmitted anywhere, and you can clear it anytime from the "Your scan history" section. The one exception to the "nothing leaves your device" rule is the optional "Use your own AI" section: if you choose to copy the generated prompt into ChatGPT, Claude, Gemini, or another AI, that text goes to whichever service you pasted it into, subject to that service's own privacy policy — that's a step you take yourself, not something ATS Scan sends on your behalf.</p>
        </div>
        <div>
          <h4>Terms of use</h4>
          <p>By using ATS Scan you agree to these terms. ATS Scan is a free tool meant to help you understand and improve how your resume reads to keyword-based applicant tracking systems. It does not guarantee an interview, a job offer, or any other hiring outcome. Hiring decisions are made solely by the employer — ATS Scan has no relationship with, and no control or influence over, the hiring process at any company. You're responsible for the accuracy of anything you submit to an employer, including any text you edit after using this tool; ATS Scan does not review, verify, or vouch for your resume's content. Use these results as one input among many when preparing your application, not as a promise of results. Don't use ATS Scan to process resumes or personal data belonging to someone else without their permission.</p>
        </div>
        <div>
          <h4>Disclaimer &amp; limitation of liability</h4>
          <p>ATS Scan is provided "as is," without warranties of any kind, express or implied, including fitness for a particular purpose or accuracy of results. The formatting checks and keyword-overlap score are heuristics, not a simulation of any specific employer's actual ATS software, and results from the optional AI bridge come from whichever third-party AI service you choose — ATS Scan does not generate, review, or endorse that output. To the fullest extent permitted by law, ATS Scan and its operator are not liable for any indirect, incidental, or consequential damages — including a missed job opportunity — arising from your use of this tool.</p>
        </div>
        <div>
          <h4>Changes</h4>
          <p>These terms may be updated from time to time as the tool changes; continued use after an update means you accept the revised terms.</p>
        </div>
        <p style={{ fontSize: 11, color: 'var(--ink-dim)', opacity: 0.7, marginTop: 4 }}>© {new Date().getFullYear()} ATS Scan. Last updated {LAST_UPDATED}.</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('ats-root')).render(<App />);
</script>
